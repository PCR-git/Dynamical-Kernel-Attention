[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamical-kernel-attention"
version = "0.1.0"
description = "Dynamical Kernel Attention (DKA), built on Robust Filter Attention (RFA)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Peter Racioppo" }]
requires-python = ">=3.11"
# Loose bounds for installing; requirements.txt pins the versions the paper's runs used.
dependencies = [
    "torch>=2.5",
    "numpy",
    "matplotlib",
    "tqdm",
    "transformers",
    "datasets",
]

[project.optional-dependencies]
notebooks = ["scipy", "jupyter"]
compile = ['triton-windows>=3.7,<3.8; sys_platform == "win32"']  # torch.compile on Windows; Linux torch wheels include Triton

[tool.setuptools]
# Only dka (with dka.model, dka.training, dka.utils) is installed; dynamics/ and visualization/ serve the notebooks.
packages = { find = { include = ["dka*"] } }
